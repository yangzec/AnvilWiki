<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">PC fishing activity sequence</title>
<rect width="1200" height="675" rx="28" fill="#101c24"/>
<text x="70" y="110" fill="#a8dfbb" font-family="sans-serif" font-size="34" font-weight="700">PC fishing activity sequence</text>
<text x="70" y="165" fill="#c5d2d7" font-family="sans-serif" font-size="22">Clover Time · Navigation diagram</text>
<rect x="70" y="245" width="320" height="250" rx="20" fill="#203340" stroke="#78bb92" stroke-width="2"/>
<text x="94" y="292" fill="#9bd9b1" font-family="sans-serif" font-size="23">01</text>
<text x="94" y="343" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700">Start</text>
<text x="94" y="394" fill="#d5e1e6" font-family="sans-serif" font-size="22">V and bait selection</text>
<rect x="430" y="245" width="320" height="250" rx="20" fill="#203340" stroke="#78bb92" stroke-width="2"/>
<text x="454" y="292" fill="#9bd9b1" font-family="sans-serif" font-size="23">02</text>
<text x="454" y="343" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700">Bite</text>
<text x="454" y="394" fill="#d5e1e6" font-family="sans-serif" font-size="22">Wait, then clicking</text>
<text x="454" y="426" fill="#d5e1e6" font-family="sans-serif" font-size="22">minigame</text>
<rect x="790" y="245" width="320" height="250" rx="20" fill="#203340" stroke="#78bb92" stroke-width="2"/>
<text x="814" y="292" fill="#9bd9b1" font-family="sans-serif" font-size="23">03</text>
<text x="814" y="343" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700">Catch</text>
<text x="814" y="394" fill="#d5e1e6" font-family="sans-serif" font-size="22">Inspect the inventory</text>
<text x="814" y="426" fill="#d5e1e6" font-family="sans-serif" font-size="22">item</text>
<text x="70" y="595" fill="#9bb0bc" font-family="sans-serif" font-size="21">Read the matching menu or action label on your device.</text></svg>
