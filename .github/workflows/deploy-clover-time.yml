name: Deploy Clover Time

on:
  push:
    branches: [clover-time]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-clover-time
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/clover-time'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_PAGES_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and build
        uses: ./.github/actions/gates
        with:
          site-url: https://clovertime.world
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository Actions secrets. Cloud environment credentials are separate.'
            exit 1
          fi
      - name: Deploy verified dist to the existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.149.0 pages deploy dist
          --project-name clover-time-wiki-preview --branch clover-time
          --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Notify IndexNow only for an indexable production build
        run: |
          if grep -Eq '^ANVIL_BUILD_MODE[[:space:]]*=[[:space:]]*"preview"' wrangler.toml; then
            echo '[IndexNow] Protected preview: submission intentionally skipped.'
          else
            pnpm submit-indexnow -- --site https://clovertime.world \
              --wait-for-deploy "$GITHUB_SHA" --wait-for-key --wait-seconds 150
          fi
