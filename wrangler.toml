# Clover Time Pages project. pnpm build renders the protected preview
# into dist and reads these build variables explicitly. Production content
# remains draft-gated; see docs/clover-time/initialization-optimization-20261010.md.
# Credentials belong in cloud environment settings, never this file.
name = "clover-time-wiki-preview"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

[vars]
ANVIL_BUILD_MODE = "production"
NODE_VERSION = "22"
SITE_URL = "https://clovertime.world"
INDEXNOW_KEY = ""
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
PUBLIC_CF_BEACON_TOKEN = ""
PUBLIC_ADSENSE_CLIENT = ""
PUBLIC_ADSENSE_SLOT_STICKY = ""
PUBLIC_ADSENSE_SLOT_SIDEBAR = ""
PUBLIC_ADSENSE_SLOT_INCONTENT = ""
PUBLIC_ADSTERRA_SLOT_SIDEBAR_300X250 = ""
PUBLIC_ADSTERRA_SLOT_INCONTENT_728X90 = ""
PUBLIC_ADSTERRA_SLOT_NATIVE_BANNER = ""
PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X300 = ""
PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X600 = ""
PUBLIC_ADSTERRA_SLOT_STICKY_320X50 = ""
PUBLIC_GA_ID = "G-XH7GWVG8ZK"
PUBLIC_PLAUSIBLE_SRC = "https://analytics.clipcanva.com/js/script.js"
PUBLIC_GSC_VERIFICATION = ""
